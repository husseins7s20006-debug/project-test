<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Happy Birthday AHMED</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #0d0d0d;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            overflow-x: hidden;
        }

        /* Intro Sequence Section */
        #intro-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background-color: #050505;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 100;
        }

        .intro-text {
            font-size: 4rem;
            font-weight: 900;
            color: #ff2a5f;
            text-shadow: 0 0 20px #ff2a5f, 0 0 40px #ff2a5f;
            opacity: 0;
            transform: scale(0.5);
            transition: all 0.5s ease-in-out;
            position: absolute;
            text-align: center;
        }

        .intro-text.active {
            opacity: 1;
            transform: scale(1.2);
        }

        /* Main Content Section */
        #main-content {
            display: none;
            flex-direction: column;
            align-items: center;
            width: 100%;
            padding: 20px;
            opacity: 0;
            transition: opacity 1s ease;
        }

        .controls {
            margin-bottom: 25px;
        }

        .btn {
            padding: 12px 28px;
            font-size: 16px;
            font-weight: bold;
            color: #ffffff;
            background: linear-gradient(45deg, #ff2a5f, #ff758c);
            border: none;
            border-radius: 30px;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(255, 42, 95, 0.4);
            transition: transform 0.2s;
            margin: 0 8px;
        }

        .btn:hover {
            transform: scale(1.05);
        }

        /* Flipbook Styles */
        .book-container {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 480px;
            width: 100%;
            perspective: 1200px;
            position: relative;
        }

        .book {
            position: relative;
            width: 280px;
            height: 360px;
            transform-style: preserve-3d;
            transition: transform 1s;
        }

        .page {
            position: absolute;
            width: 100%;
            height: 100%;
            top: 0;
            left: 0;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.6);
            transform-origin: left center;
            transition: transform 0.9s cubic-bezier(0.4, 0, 0.2, 1), top 1s, left 1s, width 1s, height 1s;
            background: #ffffff;
            border: 4px solid #ffffff;
        }

        .page img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .page.flipped {
            transform: rotateY(-140deg);
            pointer-events: none;
        }

        /* Heart Layout Styles */
        .book.heart-shape {
            width: 100%;
            height: 520px;
        }

        .book.heart-shape .page {
            width: 110px;
            height: 140px;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(255, 42, 95, 0.6);
            transform: rotateY(0deg) !important;
        }
    </style>
</head>
<body>

    <audio id="bg-music" loop preload="auto">
        <source src="كل سنة.mp4" type="video/mp4">
    </audio>

    <div id="intro-container">
        <div class="intro-text" id="step-0">2</div>
        <div class="intro-text" id="step-1">1</div>
        <div class="intro-text" id="step-2">HAPPY</div>
        <div class="intro-text" id="step-3">BIRTHDAY</div>
        <div class="intro-text" id="step-4">TO YOU</div>
        <div class="intro-text" id="step-5">AHMED</div>
        <div class="intro-text" id="step-6">❤️</div>
    </div>

    <div id="main-content">
        <div class="controls">
            <button class="btn" id="musicBtn" onclick="toggleMusic()">Music: ON / OFF</button>
            <button class="btn" onclick="arrangeInHeart()">Arrange Heart</button>
        </div>

        <div class="book-container">
            <div class="book" id="photoBook">
                <div class="page"><img src="1.jpg" alt="صقر.jpeg"></div>
                <div class="page"><img src="2.jpg" alt="صقر 2.jpeg"></div>
                <div class="page"><img src="3.jpg" alt="WhatsApp Image 2026-10-08 at 1.15.37 AM (3).jpeg"></div>
                <div class="page"><img src="4.jpg" alt="صقر 3.jpeg"></div>
                <div class="page"><img src="5.jpg" alt="صقر 4.jpeg"></div>
                <div class="page"><img src="6.jpg" alt="WhatsApp Image 2026-10-08 at 1.15.36 AM.jpeg"></div>
                <div class="page"><img src="7.jpg" alt="WhatsApp Image 2026-10-08 at 1.15.34 AM.jpeg"></div>
                <div class="page"><img src="8.jpg" alt="صقر 6.jpeg - Shortcut"></div>
                <div class="page"><img src="9.jpg" alt="WhatsApp Image 2026-10-08 at 1.15.37 AM (1).jpeg"></div>
                <div class="page"><img src="10.jpg" alt="WhatsApp Image 2026-10-08 at 1.15.37 AM (2).jpeg"></div>
            </div>
        </div>
    </div>

    <script>
        let currentIntroStep = 0;
        const totalIntroSteps = 7;
        let currentPageIndex = 0;
        const pages = document.querySelectorAll('.page');
        let autoFlipInterval;

        window.onload = function() {
            runIntroSequence();
        };

        function runIntroSequence() {
            if (currentIntroStep < totalIntroSteps) {
                if (currentIntroStep > 0) {
                    document.getElementById(`step-${currentIntroStep - 1}`).classList.remove('active');
                }
                const currentEl = document.getElementById(`step-${currentIntroStep}`);
                currentEl.classList.add('active');
                currentIntroStep++;
                setTimeout(runIntroSequence, 1200);
            } else {
                document.getElementById(`step-${totalIntroSteps - 1}`).classList.remove('active');
                const introContainer = document.getElementById('intro-container');
                introContainer.style.opacity = '0';
                introContainer.style.transition = 'opacity 1s ease';
                
                setTimeout(() => {
                    introContainer.style.display = 'none';
                    const mainContent = document.getElementById('main-content');
                    mainContent.style.display = 'flex';
                    setTimeout(() => {
                        mainContent.style.opacity = '1';
                        startAutoFlip();
                    }, 50);
                }, 1000);
            }
        }

        function startAutoFlip() {
            autoFlipInterval = setInterval(autoFlipNextPage, 2500);
        }

        function autoFlipNextPage() {
            if (currentPageIndex < pages.length) {
                pages[currentPageIndex].classList.add('flipped');
                currentPageIndex++;
            } else {
                clearInterval(autoFlipInterval);
                setTimeout(arrangeInHeart, 1000);
            }
        }

        function toggleMusic() {
            const audio = document.getElementById('bg-music');
            if (audio.paused) {
                audio.play();
            } else {
                audio.pause();
            }
        }

        function arrangeInHeart() {
            clearInterval(autoFlipInterval);
            const book = document.getElementById('photoBook');
            book.classList.add('heart-shape');

            const heartPositions = [
                { top: '60px',  left: 'calc(50% - 150px)' },
                { top: '10px',  left: 'calc(50% - 80px)'  },
                { top: '60px',  left: 'calc(50% - 10px)'  },
                { top: '10px',  left: 'calc(50% + 60px)'  },
                { top: '60px',  left: 'calc(50% + 130px)' },
                { top: '170px', left: 'calc(50% + 90px)'  },
                { top: '270px', left: 'calc(50% + 40px)'  },
                { top: '370px', left: 'calc(50% - 10px)'  },
                { top: '270px', left: 'calc(50% - 60px)'  },
                { top: '170px', left: 'calc(50% - 110px)' }
            ];

            pages.forEach((page, index) => {
                page.classList.remove('flipped');
                setTimeout(() => {
                    page.style.top = heartPositions[index].top;
                    page.style.left = heartPositions[index].left;
                }, index * 100);
            });
        }
    </script>
</body>
</html>
