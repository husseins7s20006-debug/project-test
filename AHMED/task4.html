<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Happy Birthday AHMED</title>
    <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&family=Poppins:wght@400;600;900&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #030305;
            font-family: 'Poppins', sans-serif;
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            position: relative;
        }

        #start-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: radial-gradient(circle at center, #26040a 0%, #090102 100%);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 300;
            cursor: pointer;
        }

        #start-overlay h2 {
            font-size: 2.2rem;
            color: #ffd166;
            margin-bottom: 12px;
            animation: pulse 1.5s infinite;
            text-shadow: 0 0 20px rgba(255, 209, 102, 0.75);
        }

        #start-overlay p {
            font-size: 1rem;
            color: #ff7b86;
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.06); }
        }

        #intro-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background-color: #120205;
            z-index: 200;
            transition: opacity 1s ease;
        }

        #matrix-canvas {
            display: block;
            width: 100%;
            height: 100%;
        }

        #bg-stars-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 1;
            pointer-events: none;
        }

        #main-content {
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            width: 100%;
            height: 100vh;
            padding: 20px;
            opacity: 0;
            transition: opacity 1.2s ease;
            z-index: 10;
            position: relative;
        }

        .white-message-card {
            background: #ffffff;
            width: 90%;
            max-width: 560px;
            min-height: 85px;
            border-radius: 18px;
            padding: 20px 30px;
            margin-bottom: 30px;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            box-shadow: 0 10px 35px rgba(255, 34, 59, 0.35), 0 0 15px rgba(255, 255, 255, 0.5);
            transition: opacity 0.5s ease, transform 0.5s ease;
        }

        .white-message-card .corner-heart {
            position: absolute;
            top: 12px;
            right: 16px;
            color: #ff223b;
            font-size: 16px;
            animation: heartbeat 1.2s infinite;
        }

        @keyframes heartbeat {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.25); }
        }

        .white-message-card p {
            font-family: 'Dancing Script', cursive;
            font-size: 1.8rem;
            color: #ff223b;
            text-align: center;
            font-weight: 700;
            line-height: 1.3;
        }

        .book-wrapper {
            position: relative;
            width: 560px;
            max-width: 92vw;
            height: 360px;
            perspective: 1800px;
            display: flex;
            justify-content: center;
            align-items: center;
            transition: opacity 0.8s ease;
        }

        .book {
            position: relative;
            width: 100%;
            height: 100%;
            transform-style: preserve-3d;
        }

        .spread {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            transform-style: preserve-3d;
        }

        .half-page {
            width: 50%;
            height: 100%;
            background: #ffffff;
            padding: 10px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.7);
            position: relative;
            overflow: hidden;
        }

        .half-page.left {
            border-radius: 14px 4px 4px 14px;
            border-right: 1px solid #e0e0e0;
            box-shadow: inset -12px 0 20px rgba(0, 0, 0, 0.08), 0 15px 35px rgba(0, 0, 0, 0.6);
        }

        .half-page.right {
            border-radius: 4px 14px 14px 4px;
            border-left: 1px solid #e0e0e0;
            box-shadow: inset 12px 0 20px rgba(0, 0, 0, 0.08), 0 15px 35px rgba(0, 0, 0, 0.6);
        }

        .half-page img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 8px;
            display: block;
        }

        .flip-sheet {
            position: absolute;
            top: 0;
            right: 0;
            width: 50%;
            height: 100%;
            transform-origin: left center;
            transform-style: preserve-3d;
            transition: transform 1.1s cubic-bezier(0.645, 0.045, 0.355, 1);
            z-index: 5;
        }

        .flip-sheet.flipped {
            transform: rotateY(-180deg);
        }

        .sheet-front, .sheet-back {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            backface-visibility: hidden;
            background: #ffffff;
            padding: 10px;
            overflow: hidden;
        }

        .sheet-front {
            border-radius: 4px 14px 14px 4px;
            box-shadow: inset 12px 0 20px rgba(0, 0, 0, 0.08), 0 10px 25px rgba(0, 0, 0, 0.5);
        }

        .sheet-back {
            transform: rotateY(180deg);
            border-radius: 14px 4px 4px 14px;
            box-shadow: inset -12px 0 20px rgba(0, 0, 0, 0.08), 0 10px 25px rgba(0, 0, 0, 0.5);
        }

        .sheet-front img, .sheet-back img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 8px;
        }

        #heart-gallery {
            display: none;
            position: relative;
            width: 100%;
            height: 100vh;
            justify-content: center;
            align-items: center;
        }

        .heart-card {
            position: absolute;
            width: 85px;
            height: 105px;
            background: #ffffff;
            padding: 4px;
            border-radius: 10px;
            box-shadow: 0 0 18px #ff223b, 0 0 35px rgba(255, 34, 59, 0.6);
            border: 2px solid #ff223b;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) scale(0) rotate(0deg);
            opacity: 0;
            transition: all 1.4s cubic-bezier(0.22, 1, 0.36, 1);
        }

        .heart-card img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 6px;
        }

        @media (max-width: 600px) {
            .book-wrapper { height: 240px; }
            .white-message-card p { font-size: 1.35rem; }
            .heart-card { width: 58px; height: 72px; }
        }
    </style>
</head>
<body>

    <audio id="bg-music" loop preload="auto">
        <source src="كل سنة - Trim.mp4" type="video/mp4">
    </audio>

    <div id="start-overlay" onclick="startExperience()">
        <h2>اضغط هنا للبدء ✨</h2>
        <p>Click anywhere to start</p>
    </div>

    <div id="intro-container">
        <canvas id="matrix-canvas"></canvas>
    </div>

    <canvas id="bg-stars-canvas"></canvas>

    <div id="main-content">
        <div class="white-message-card" id="message-card">
            <span class="corner-heart">❤️</span>
            <p id="typewriter-text"></p>
        </div>

        <div class="book-wrapper" id="book-wrapper">
            <div class="book" id="book">
                <div class="spread" id="base-spread">
                    <div class="half-page left"><img id="base-left-img" src="" alt=""></div>
                    <div class="half-page right"><img id="base-right-img" src="" alt=""></div>
                </div>
            </div>
        </div>

        <div id="heart-gallery"></div>
    </div>

    <script>
        const photoList = [
            "WhatsApp Image 2026-11-13 at 8.35.14 AM.jpeg", "صقر.jpeg", "صقر 2.jpeg", "WhatsApp Image 2026-10-08 at 1.15.37 AM (3).jpeg", "صقر 4.jpeg",
            ".jpeg", "A.jpeg", "WhatsApp Image 2026-10-08 at 1.15.37 AM (4).jpeg", "WhatsApp Image 2026-10-08 at 1.15.37 AM (1).jpeg", "WhatsApp Image 2026-10-08 at 1.15.37 AM (2).jpeg",
            "WhatsApp Image 2026-10-08 at 1.15.34 AM.jpeg", "صقر 5.jpeg", "WhatsApp Image 2026-10-08 at 1.15.37 AM (1).jpeg", "WhatsApp Image 2026-11-13 at 8.35.15 AM.jpeg", "WhatsApp Image 2026-11-13 at 8.47.56 AM.jpeg",
            "WhatsApp Image 2026-U1-13 at 8.47.56 AM.jpeg", "WhatsApp Image 2026-11-13 a0t 8.47.56 AM.jpeg", "صقر.jpeg"
        ];

        const messages = [
            "My love for you grows stronger every day! ❤️",
            "You make my heart skip a beat! 💓",
            "You light up my world! ✨",
            "Happy Birthday to my favorite person! 🎂",
            "Cherish every moment together! 🥰",
            "Every memory with you is a treasure! 🌟",
            "Wishing you a lifetime of happiness! 🎉",
            "May your year be filled with endless joy! 🥂",
            "The End... But Our Story Continues! 💫 Forever Together! ♾️"
        ];

        let matrixAnimId;
        let bgStarsAnimId;

        function startExperience() {
            document.getElementById('start-overlay').style.display = 'none';
            const audio = document.getElementById('bg-music');
            audio.play().catch(() => {});

            runMatrixParticleIntro();
        }

        function runMatrixParticleIntro() {
            const rainCanvas = document.getElementById('matrix-canvas');
            const rctx = rainCanvas.getContext('2d');
            const W = window.innerWidth;
            const H = window.innerHeight;
            rainCanvas.width = W;
            rainCanvas.height = H;

            const textCanvas = document.createElement('canvas');
            textCanvas.width = W;
            textCanvas.height = H;
            textCanvas.style.cssText = 'position:absolute;top:0;left:0;width:100%;height:100%;';
            document.getElementById('intro-container').appendChild(textCanvas);
            const tctx = textCanvas.getContext('2d');

            const isMobile = W < 600;
            const chars = "HAPPYBIRTHDAYAHMED";
            const fontSize = isMobile ? 15 : 20;
            const columns = Math.ceil(W / fontSize);
            const rows = Math.ceil(H / fontSize);
            const startTime = performance.now();

            const streams = Array.from({ length: columns }, () => ({
                row: -Math.random() * 15,
                lastRow: -1,
                speed: 0.45 + Math.random() * 0.6,
                wake: Math.random() < 0.1 ? Math.random() * 500 : 600 + Math.random() * 1800
            }));

            rctx.fillStyle = '#0a0102';
            rctx.fillRect(0, 0, W, H);

            function drawRain(now) {
                const t = now - startTime;
                rctx.fillStyle = 'rgba(10, 1, 3, 0.02)';
                rctx.fillRect(0, 0, W, H);
                rctx.font = `bold ${fontSize}px monospace`;
                rctx.textBaseline = 'top';

                for (let i = 0; i < columns; i++) {
                    const s = streams[i];
                    if (t < s.wake) continue;

                    s.row += s.speed;
                    const r = Math.floor(s.row);

                    if (r !== s.lastRow && r >= 0 && r <= rows) {
                        s.lastRow = r;
                        const rnd = Math.random();
                        rctx.fillStyle = rnd > 0.85 ? '#ff9aa5' : (rnd > 0.4 ? '#ff2a45' : '#d9142b');
                        rctx.fillText(chars[Math.floor(Math.random() * chars.length)], i * fontSize, r * fontSize);
                    }

                    if (s.row > rows + Math.random() * 12) {
                        s.row = -Math.random() * 15;
                        s.lastRow = -1;
                    }
                }
            }

            const offCanvas = document.createElement('canvas');
            const offCtx = offCanvas.getContext('2d');
            offCanvas.width = W;
            offCanvas.height = H;

            const particles = [];
            const step = isMobile ? 4 : 5;
            const dot = step * 0.85;

            function drawHeartShape(ctx, cx, cy, size) {
                ctx.beginPath();
                for (let k = 0; k <= 100; k++) {
                    const t = (k / 100) * Math.PI * 2;
                    const hx = 16 * Math.pow(Math.sin(t), 3);
                    const hy = -(13 * Math.cos(t) - 5 * Math.cos(2 * t) - 2 * Math.cos(3 * t) - Math.cos(4 * t));
                    const px = cx + hx * size;
                    const py = cy + hy * size;
                    if (k === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
                }
                ctx.closePath();
                ctx.fill();
            }

            function setTargetWord(word) {
                offCtx.clearRect(0, 0, W, H);
                offCtx.fillStyle = '#ffffff';

                if (word === 'HEART') {
                    drawHeartShape(offCtx, W / 2, H / 2, Math.min(W, H) * 0.017);
                } else {
                    const size = Math.min(W / (word.length * 0.72), H * 0.28);
                    offCtx.font = `900 ${Math.floor(size)}px 'Poppins', 'Arial Black', sans-serif`;
                    offCtx.textAlign = 'center';
                    offCtx.textBaseline = 'middle';
                    offCtx.fillText(word, W / 2, H / 2);
                }

                const imgData = offCtx.getImageData(0, 0, W, H).data;
                const points = [];
                for (let y = 0; y < H; y += step) {
                    for (let x = 0; x < W; x += step) {
                        if (imgData[(y * W + x) * 4 + 3] > 128) {
                            points.push({ x, y });
                        }
                    }
                }

                for (let i = points.length - 1; i > 0; i--) {
                    const j = Math.floor(Math.random() * (i + 1));
                    [points[i], points[j]] = [points[j], points[i]];
                }

                while (particles.length < points.length) {
                    particles.push({
                        x: Math.random() * W, y: Math.random() * H,
                        vx: 0, vy: 0, tx: 0, ty: 0, a: 0, active: false,
                        c: Math.random() > 0.25 ? '#ffe3e3' : '#ff9aa5'
                    });
                }

                for (let i = 0; i < particles.length; i++) {
                    const p = particles[i];
                    if (i < points.length) {
                        p.tx = points[i].x;
                        p.ty = points[i].y;
                        p.active = true;
                    } else {
                        p.active = false;
                    }
                }
            }

            function disperseParticles() {
                for (const p of particles) {
                    p.active = false;
                    p.vx = (Math.random() - 0.5) * 26;
                    p.vy = (Math.random() - 0.5) * 26;
                }
            }

            function drawParticles() {
                tctx.clearRect(0, 0, W, H);
                for (const p of particles) {
                    if (p.active) {
                        p.x += (p.tx - p.x) * 0.15;
                        p.y += (p.ty - p.y) * 0.15;
                        p.a = Math.min(1, p.a + 0.12);
                    } else {
                        p.x += p.vx;
                        p.y += p.vy;
                        p.vx *= 0.92;
                        p.vy *= 0.92;
                        p.a = Math.max(0, p.a - 0.07);
                    }
                    if (p.a > 0.02) {
                        tctx.globalAlpha = p.a;
                        tctx.fillStyle = p.c;
                        tctx.fillRect(p.x, p.y, dot, dot);
                    }
                }
                tctx.globalAlpha = 1;
            }

            function loop(now) {
                drawRain(now);
                drawParticles();
                matrixAnimId = requestAnimationFrame(loop);
            }
            matrixAnimId = requestAnimationFrame(loop);

            const sequence = ["3", "2", "1", "HAPPY", "BIRTHDAY", "TO", "YOU", "AHMED", "HEART"];
            let stepIdx = 0;

            setTimeout(() => {
                function nextStep() {
                    if (stepIdx < sequence.length) {
                        setTargetWord(sequence[stepIdx]);
                        const holdTime = sequence[stepIdx].length > 3 ? 1350 : 1000;
                        stepIdx++;
                        setTimeout(() => {
                            if (stepIdx < sequence.length) {
                                disperseParticles();
                                setTimeout(nextStep, 280);
                            } else {
                                setTimeout(finishIntro, 1200);
                            }
                        }, holdTime);
                    }
                }
                nextStep();
            }, 2800);
        }

        function finishIntro() {
            const intro = document.getElementById('intro-container');
            intro.style.opacity = '0';
            startBackgroundStarsAndHearts();

            setTimeout(() => {
                cancelAnimationFrame(matrixAnimId);
                intro.style.display = 'none';
                const main = document.getElementById('main-content');
                main.style.display = 'flex';
                setTimeout(() => {
                    main.style.opacity = '1';
                    startBookExperience();
                }, 50);
            }, 1000);
        }

        function startBackgroundStarsAndHearts() {
            const canvas = document.getElementById('bg-stars-canvas');
            const ctx = canvas.getContext('2d');
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;

            const stars = Array.from({ length: 85 }, () => ({
                x: Math.random() * canvas.width,
                y: Math.random() * canvas.height,
                r: Math.random() * 1.8 + 0.5,
                alpha: Math.random(),
                speed: Math.random() * 0.02 + 0.005
            }));

            const hearts = Array.from({ length: 14 }, () => ({
                x: Math.random() * canvas.width,
                y: canvas.height + Math.random() * 200,
                size: Math.random() * 12 + 10,
                speedY: Math.random() * 0.8 + 0.4,
                wobble: Math.random() * Math.PI * 2
            }));

            function drawBg() {
                ctx.clearRect(0, 0, canvas.width, canvas.height);

                for (let s of stars) {
                    s.alpha += s.speed;
                    if (s.alpha > 1 || s.alpha < 0.1) s.speed *= -1;
                    ctx.fillStyle = `rgba(255, 255, 255, ${Math.abs(s.alpha)})`;
                    ctx.beginPath();
                    ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
                    ctx.fill();
                }

                for (let h of hearts) {
                    h.y -= h.speedY;
                    h.wobble += 0.03;
                    const xPos = h.x + Math.sin(h.wobble) * 15;
                    if (h.y < -30) {
                        h.y = canvas.height + 20;
                        h.x = Math.random() * canvas.width;
                    }
                    ctx.font = `${h.size}px Arial`;
                    ctx.fillStyle = 'rgba(255, 34, 59, 0.75)';
                    ctx.fillText('❤️', xPos, h.y);
                }

                bgStarsAnimId = requestAnimationFrame(drawBg);
            }

            drawBg();
        }

        let typeTimer;
        function typeMessage(text) {
            clearInterval(typeTimer);
            const el = document.getElementById('typewriter-text');
            el.textContent = '';
            let i = 0;
            typeTimer = setInterval(() => {
                if (i < text.length) {
                    el.textContent += text.charAt(i);
                    i++;
                } else {
                    clearInterval(typeTimer);
                }
            }, 45);
        }

        function startBookExperience() {
            const book = document.getElementById('book');
            const totalSpreads = Math.ceil(photoList.length / 2);
            let currentSpread = 0;

            document.getElementById('base-left-img').src = photoList[0] || "";
            document.getElementById('base-right-img').src = photoList[1] || photoList[0] || "";

            typeMessage(messages[0]);

            function flipNextSpread() {
                if (currentSpread >= totalSpreads - 1) {
                    setTimeout(transitionToSpiralHeart, 2500);
                    return;
                }

                const nextLeftImg = photoList[(currentSpread + 1) * 2];
                const nextRightImg = photoList[(currentSpread + 1) * 2 + 1] || photoList[0];
                const currentRightImg = photoList[currentSpread * 2 + 1] || photoList[0];

                const sheet = document.createElement('div');
                sheet.className = 'flip-sheet';
                sheet.innerHTML = `
                    <div class="sheet-front"><img src="${currentRightImg}" alt=""></div>
                    <div class="sheet-back"><img src="${nextLeftImg}" alt=""></div>
                `;
                book.appendChild(sheet);

                document.getElementById('base-right-img').src = nextRightImg;

                requestAnimationFrame(() => {
                    requestAnimationFrame(() => {
                        sheet.classList.add('flipped');
                    });
                });

                currentSpread++;
                const msgIndex = Math.min(currentSpread, messages.length - 1);
                typeMessage(messages[msgIndex]);

                setTimeout(() => {
                    document.getElementById('base-left-img').src = nextLeftImg;
                    sheet.remove();
                }, 1150);

                setTimeout(flipNextSpread, 3400);
            }

            setTimeout(flipNextSpread, 3200);
        }

        function transitionToSpiralHeart() {
            const msgCard = document.getElementById('message-card');
            const bookWrapper = document.getElementById('book-wrapper');

            msgCard.style.opacity = '0';
            msgCard.style.transform = 'translateY(-20px)';
            bookWrapper.style.opacity = '0';

            setTimeout(() => {
                msgCard.style.display = 'none';
                bookWrapper.style.display = 'none';

                const gallery = document.getElementById('heart-gallery');
                gallery.style.display = 'flex';

                const count = photoList.length;
                const scale = window.innerWidth < 600 ? 11 : 17;

                photoList.forEach((src, i) => {
                    const card = document.createElement('div');
                    card.className = 'heart-card';
                    card.innerHTML = `<img src="${src}" alt="">`;
                    gallery.appendChild(card);

                    const t = (i / count) * Math.PI * 2;
                    const hx = 16 * Math.pow(Math.sin(t), 3);
                    const hy = -(13 * Math.cos(t) - 5 * Math.cos(2 * t) - 2 * Math.cos(3 * t) - Math.cos(4 * t));

                    const finalX = hx * scale;
                    const finalY = hy * scale;
                    const rot = (Math.random() - 0.5) * 18;

                    setTimeout(() => {
                        card.style.opacity = '1';
                        card.style.transform = `translate(calc(-50% + ${finalX}px), calc(-50% + ${finalY}px)) scale(1) rotate(${rot}deg)`;
                    }, i * 110);
                });
            }, 800);
        }
    </script>
</body>
</html>
