<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Happy Birthday - اخويا احمد صقر</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: #0f0d13;
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            overflow-x: hidden;
            padding: 20px;
        }

        h1.title {
            color: #ff3366;
            margin-bottom: 25px;
            font-size: 2rem;
            text-shadow: 0 0 10px rgba(255, 51, 102, 0.5);
            text-align: center;
        }

        /* حاوية الكتاب 3D */
        .book-wrapper {
            perspective: 1500px;
            margin: 20px auto;
        }

        .book {
            width: 320px;
            height: 440px;
            position: relative;
            transform-style: preserve-3d;
            box-shadow: 0 15px 35px rgba(0,0,0,0.7);
            border-radius: 10px;
        }

        /* صفحات الكتاب */
        .page {
            width: 100%;
            height: 100%;
            position: absolute;
            top: 0;
            right: 0;
            transform-origin: right center;
            transform-style: preserve-3d;
            transition: transform 0.8s cubic-bezier(0.645, 0.045, 0.355, 1);
            cursor: pointer;
            border-radius: 10px;
            background: #1a1a1a;
            border: 1px solid #333;
            overflow: hidden;
        }

        .page img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 10px;
            user-select: none;
        }

        /* تأثير تقليب الصفحة */
        .page.flipped {
            transform: rotateY(-180deg);
        }

        /* ترتيب الطبقات لـ 12 صورة */
        .page:nth-child(1)  { z-index: 12; }
        .page:nth-child(2)  { z-index: 11; }
        .page:nth-child(3)  { z-index: 10; }
        .page:nth-child(4)  { z-index: 9;  }
        .page:nth-child(5)  { z-index: 8;  }
        .page:nth-child(6)  { z-index: 7;  }
        .page:nth-child(7)  { z-index: 6;  }
        .page:nth-child(8)  { z-index: 5;  }
        .page:nth-child(9)  { z-index: 4;  }
        .page:nth-child(10) { z-index: 3;  }
        .page:nth-child(11) { z-index: 2;  }
        .page:nth-child(12) { z-index: 1;  }

        .hint {
            margin-top: 25px;
            color: #aaa;
            font-size: 0.9rem;
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0% { opacity: 0.6; }
            50% { opacity: 1; }
            100% { opacity: 0.6; }
        }
    </style>
</head>
<body>

    <h1 class="title">✨ الذكريات الجميلة ✨</h1>

    <!-- الكتاب بحجم 12 صورة -->
    <div class="book-wrapper">
        <div class="book" id="book">
            <div class="page" onclick="flipPage(this)"><img src="صقر.jpeg" alt="صورة 1"></div>
            <div class="page" onclick="flipPage(this)"><img src="صقر 2.jpeg" alt="صورة 2"></div>
            <div class="page" onclick="flipPage(this)"><img src="صقر 4.jpeg" alt="صورة 3"></div>
            <div class="page" onclick="flipPage(this)"><img src=".jpeg" alt="صورة 4"></div>
            <div class="page" onclick="flipPage(this)"><img src="WhatsApp Image 2026-10-08 at 1.15.37 AM (3).jpeg" alt="صورة 5"></div>
            <div class="page" onclick="flipPage(this)"><img src="صقر 6.jpeg - Shortcut" alt="صورة 6"></div>
            <div class="page" onclick="flipPage(this)"><img src="WhatsApp Image 2026-10-08 at 1.15.37 AM (1).jpeg" alt="صورة 7"></div>
            <div class="page" onclick="flipPage(this)"><img src="WhatsApp Image 2026-10-08 at 1.15.37 AM.jpeg" alt="صورة 8"></div>
            <div class="page" onclick="flipPage(this)"><img src="WhatsApp Image 2026-10-08 at 1.15.37 AM (2).jpeg" alt="صورة 9"></div>
            <div class="page" onclick="flipPage(this)"><img src="صقر 5.jpeg" alt="صورة 10"></div>
            <div class="page" onclick="flipPage(this)"><img src="WhatsApp Image 2026-10-08 at 1.15.36 AM.jpeg" alt="صورة 11"></div>
            <div class="page" onclick="flipPage(this)"><img src="WhatsApp Image 2026-10-08 at 1.15.34 AM.jpeg" alt="صورة 12"></div>
        </div>
    </div>

    <p class="hint">💡 اضغط على الصفحة لتقليبها وتصفح الكتاب</p>

    <!-- ملف الصوت -->
    <audio id="bgMusic" src="كل سنة.mp4" loop preload="auto"></audio>

    <script>
        const music = document.getElementById("bgMusic");
        let isMusicStarted = false;

        function startMusicAuto() {
            if (!isMusicStarted) {
                music.play().then(() => {
                    isMusicStarted = true;
                }).catch(err => console.log("في انتظار التفاعل لتشغيل الصوت"));
            }
        }

        document.addEventListener('click', startMusicAuto);

        function flipPage(pageElement) {
            startMusicAuto();
            pageElement.classList.toggle('flipped');
        }
    </script>
</body>
</html>
